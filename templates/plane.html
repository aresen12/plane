<link href="/static/css/plane.css" rel="stylesheet" type="text/css">

{% extends "base.html" %}
{% block content %}
<h1>
    <svg width="60" viewBox="-3 -2 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier">
            <circle cx="12" cy="13" fill="#cee0fe" r="15"></circle>
            <path d="M3 9H21M17 13.0014L7 13M10.3333 17.0005L7 17M7 3V5M17 3V5M6.2 21H17.8C18.9201 21 19.4802 21 19.908 20.782C20.2843 20.5903 20.5903 20.2843 20.782 19.908C21 19.4802 21 18.9201 21 17.8V8.2C21 7.07989 21 6.51984 20.782 6.09202C20.5903 5.71569 20.2843 5.40973 19.908 5.21799C19.4802 5 18.9201 5 17.8 5H6.2C5.0799 5 4.51984 5 4.09202 5.21799C3.71569 5.40973 3.40973 5.71569 3.21799 6.09202C3 6.51984 3 7.07989 3 8.2V17.8C3 18.9201 3 19.4802 3.21799 19.908C3.40973 20.2843 3.71569 20.5903 4.09202 20.782C4.51984 21 5.07989 21 6.2 21Z"
                  stroke="#2e76e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
    </svg>
</h1>
<div id="title_plane" class="{{plane.title}}">
    <div style="border-radius: 20px; overflow:hidden; width: fit-content;">
        <table class="table-plane" id="main_table">
            <tr class="table-head">
                <th class="number">№</th>
                <th>Название</th>
                <th>Описание</th>
                <th>приоритет</th>
                <th></th>
            </tr>
            {% for i in range(1, plane.data|length + 1) %}
            <tr id="row{{ i}}">
                <td>{{ i }}</td>
                <td><input id="name{{ i}}" class="form-control" value="{{plane.data[i|string]['name']}}"></td>
                <td><input id="about{{ i}}" class="form-control" value="{{plane.data[i|string]['about']}}"></td>
                <td><input id="pr{{ i}}" class="form-control" value="{{plane.data[i|string]['pr']}}"></td>
                <td>
                    <button onclick="app.delete_row('{{i}}')" class="delete-btn">
                        <svg viewBox="0 0 24 24" width="20px" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                                <path d="M10 12V17" stroke="#000000" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"></path>
                                <path d="M14 12V17" stroke="#000000" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"></path>
                                <path d="M4 7H20" stroke="#000000" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"></path>
                                <path d="M6 10V18C6 19.6569 7.34315 21 9 21H15C16.6569 21 18 19.6569 18 18V10"
                                      stroke="#000000" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"></path>
                                <path d="M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7H9V5Z"
                                      stroke="#000000" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"></path>
                            </g>
                        </svg>
                    </button>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <button class="add-btn" onclick="add_new_row()">+ Добавить задачу</button>

    <button type="submit" class="submit-btn center-div" onclick="send_edit()">Сохранить план</button>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="/static/js/plane.js"></script>
<script>
    var app = new App({{plane.data|length}}, {{plane.id}});
</script>
{% endblock %}
